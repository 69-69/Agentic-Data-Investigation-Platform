spring:
  application:
    name: experience-service
  main:
    web-application-type: servlet
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${EXPERIENCE_SERVICE_PORT:8080}
  shutdown: graceful
agent:
  base-url: ${AGENT_SERVICE_BASE_URL:http://localhost:8000}
  connect-timeout: ${AGENT_CONNECT_TIMEOUT:2s}
  request-timeout: ${AGENT_REQUEST_TIMEOUT:65s}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: logstash
