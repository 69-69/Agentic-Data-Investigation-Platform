# Local PostgreSQL with migrations and deterministic synthetic data. No application containers.
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/database:ro
      - ./database/seed/010-bootstrap.sh:/docker-entrypoint-initdb.d/010-bootstrap.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -X -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc \"SELECT 1 WHERE (SELECT count(*) FROM platform.schema_migrations WHERE version IN (1,2)) = 2 AND EXISTS (SELECT 1 FROM platform.seed_history WHERE dataset_version = 'synthetic-v1')\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
# Add frontend, experience-service, and agent-service after implementation.
volumes:
  postgres_data:
