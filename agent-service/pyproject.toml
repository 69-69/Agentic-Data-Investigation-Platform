[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "investigation-agent-service"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "Bounded SQL investigation workflow with explicit tool security"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "langgraph==1.2.11", "langchain==1.4.0", "langchain-openai==1.6.2", "pydantic-settings==2.15.0", "psycopg[binary]==3.3.5", "sqlglot==30.18.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "httpx==0.28.1", "ruff==0.16.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
